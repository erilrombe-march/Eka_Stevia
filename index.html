
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050008">
<title>LOVE JAMILAH ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background: #050008;
    color: #ffb6c1;
    font-family: "Times New Roman", serif;
}

#heartCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.lyrics-box {
    position: fixed;
    top: 7%;
    left: 5%;
    right: 5%;
    min-height: 45px;
    text-align: center;
    z-index: 2;
    pointer-events: none;
}

#lyrics {
    color: #ffd1dc;
    font-size: clamp(15px, 2.8vw, 23px);
    font-weight: bold;
    text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493;
    animation: lyricGlow 2s ease-in-out infinite alternate;
}

@keyframes lyricGlow {
    from {
        opacity: 0.75;
        text-shadow: 0 0 8px #ff1493;
    }
    to {
        opacity: 1;
        text-shadow: 0 0 18px #ff1493, 0 0 28px #ff69b4;
    }
}

.controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 5%;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 12px;
}

#startButton {
    border: 1px solid #ffb6c1;
    border-radius: 30px;
    padding: 13px 28px;
    background: linear-gradient(135deg, #ff1493, #a00070);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px #ff1493;
    transition: transform 0.2s, box-shadow 0.2s;
}

#startButton:hover {
    transform: scale(1.06);
    box-shadow: 0 0 30px #ff69b4;
}

#status {
    max-width: 90%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #ffb6c1;
    text-shadow: 0 0 8px #ff1493;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<canvas id="heartCanvas"></canvas>

<div class="lyrics-box">
    <div id="lyrics">❤️ Sebuah pesan untukmu ❤️</div>
</div>

<div class="controls">
    <button id="startButton">❤️ MULAI ❤️</button>
    <div id="status">Tekan tombol untuk memulai musik dan animasi</div>
</div>

<audio id="music" preload="auto">
    <source src="./1010.MP3" type="audio/mpeg">
    Browser kamu tidak mendukung audio.
</audio>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");
const lyricsElement = document.getElementById("lyrics");
const startButton = document.getElementById("startButton");
const statusElement = document.getElementById("status");

// Volume sama seperti program Python: 0.7
music.volume = 0.7;

// Daftar lirik dan timestamp dari kode Python
const lyricsList = [
    [0,  "🎵 I Love You"],
    [1,  "Ingin Rasanya Hatiku"],
    [4,  "Memeluk dan Menciummu"],
    [7,  "Dan Ingin Kukatakan Cinta Kamu"],
    [12, "Ingin Hati Ini Lebih Dekat Lagi Denganmu"],
    [18, "Dan Kukatakan"],
    [22, "I Will Say I Love You"],
    [28, ""],
    [34, "Di Hari Berikutnya (our next day)"],
    [39, "Kujumpa Lagi Denganmu"],
    [42, "When I Saw You (Kau Semakin Mempesona)"],
    [48, "Senyuman di Bibirmu Membuatku Tergila-gila"],
    [58, "Khayalku Membayangkan Kapankah Kau Jadi Milikku"],
    [68, "Khayalku Kau Tercipta Hanyalah Untuk"],
    [76, "Hanya Untukku"],
    [81, ""]
];

let width = 0;
let height = 0;
let centerX = 0;
let centerY = 0;
let heartScale = 10;
let frame = 0;
let animationRunning = false;
let animationId = null;

const stars = Array.from({ length: 100 }, () => ({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 1.8 + 0.4,
    phase: Math.random() * Math.PI * 2
}));

// Menyesuaikan canvas dengan ukuran layar
function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    centerX = width / 2;

    // Menggeser hati sedikit ke atas agar tombol tidak menutupi
    centerY = height * 0.49;

    // Menyesuaikan ukuran hati dengan HP maupun komputer
    heartScale = Math.min(
        width / 38,
        height / 43,
        15
    );

    drawHeart();
}

window.addEventListener("resize", resizeCanvas);

// Rumus hati yang sama dengan kode Python
function heartPoint(angle, size) {
    const x = 16 * Math.pow(Math.sin(angle), 3);

    const y =
        13 * Math.cos(angle) -
        5 * Math.cos(2 * angle) -
        2 * Math.cos(3 * angle) -
        Math.cos(4 * angle);

    return {
        x: centerX + x * size,
        y: centerY - y * size
    };
}

// Efek bintang di latar belakang
function drawStars() {
    for (const star of stars) {
        const opacity =
            0.25 +
            0.75 *
            Math.abs(
                Math.sin(frame * 0.025 + star.phase)
            );

        ctx.globalAlpha = opacity;
        ctx.fillStyle = "#ffd1e8";

        ctx.beginPath();
        ctx.arc(
            star.x * width,
            star.y * height,
            star.size,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

// Menggambar garis luar hati
function drawHeartOutline(size) {
    ctx.beginPath();

    for (let i = 0; i <= 360; i++) {
        const angle = i * Math.PI / 180;
        const p = heartPoint(angle, size);

        if (i === 0) {
            ctx.moveTo(p.x, p.y);
        } else {
            ctx.lineTo(p.x, p.y);
        }
    }

    ctx.closePath();

    ctx.strokeStyle = "#ff1493";
    ctx.lineWidth = 2;
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ff1493";
    ctx.stroke();
}

// Menulis I LOVE YOU berulang di dalam bentuk hati
function drawLoveText(size) {
    const layers = 6;
    const total = 100;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const fontSize = Math.max(
        6,
        Math.min(10, heartScale * 0.65)
    );

    ctx.font = `bold ${fontSize}px Times New Roman`;
    ctx.shadowBlur = 5;
    ctx.shadowColor = "#ff1493";

    for (let layer = 0; layer < layers; layer++) {
        const layerScale = size * (0.40 + layer * 0.105);

        for (let i = 0; i < total; i++) {
            const angle = i * Math.PI * 2 / total;
            const p = heartPoint(angle, layerScale);

            const glow =
                0.55 +
                0.45 *
                Math.sin(frame * 0.035 + i * 0.25 + layer);

            ctx.globalAlpha = Math.max(0.2, glow);

            ctx.fillStyle = layer % 2 === 0
                ? "#ffb6c1"
                : "#ff69b4";

            ctx.fillText("I LOVE YOU", p.x, p.y);
        }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
}

// Nama di tengah hati
function drawName() {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const fontSize = Math.max(9, Math.min(15, heartScale * 0.9));

    ctx.font = `bold ${fontSize}px Times New Roman`;
    ctx.fillStyle = "#ff1493";
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#ff1493";

    ctx.fillText("EKA STEVIA", centerX, centerY);

    ctx.shadowBlur = 0;
}

// Menggambar keseluruhan animasi
function drawHeart() {
    ctx.clearRect(0, 0, width, height);

    drawStars();

    const pulse =
        1 + Math.sin(frame * 0.055) * 0.035;

    const size = heartScale * pulse;

    drawHeartOutline(size);
    drawLoveText(size);
    drawName();
}

// Loop animasi
function animate() {
    if (!animationRunning) return;

    frame++;
    drawHeart();

    animationId = requestAnimationFrame(animate);
}

// Lirik mengikuti posisi lagu yang sebenarnya
function updateLyrics() {
    const elapsed = music.currentTime;
    let currentLyric = "";

    for (const [timestamp, lyric] of lyricsList) {
        if (elapsed >= timestamp) {
            currentLyric = lyric;
        } else {
            break;
        }
    }

    lyricsElement.textContent = currentLyric;
}

music.addEventListener("timeupdate", updateLyrics);

// Ketika musik selesai
music.addEventListener("ended", () => {
    lyricsElement.textContent = "❤️❤️❤️";

    statusElement.textContent =
        "Semoga tetap tersenyum hari ini Jamilah ❤️";

    startButton.textContent = "❤️ PUTAR LAGI ❤️";
    startButton.classList.remove("hidden");
});

// Menangani jika file musik gagal dimuat
music.addEventListener("error", () => {
    statusElement.textContent =
        "Musik tidak ditemukan. Pastikan 1010.MP3 sudah diunggah.";

    startButton.classList.remove("hidden");
});

// Tombol mulai dan putar ulang
startButton.addEventListener("click", async () => {
    startButton.disabled = true;
    statusElement.textContent = "Menyiapkan musik...";

    try {
        // Browser memerlukan interaksi pengguna untuk memulai audio
        await music.play();

        if (!animationRunning) {
            animationRunning = true;
            animate();
        }

        startButton.classList.add("hidden");
        statusElement.textContent = "";

        updateLyrics();

    } catch (error) {
        console.error(error);

        statusElement.textContent =
            "Musik gagal diputar. Periksa file 1010.MP3.";

        startButton.classList.remove("hidden");

    } finally {
        startButton.disabled = false;
    }
});

// Gambar awal tanpa menunggu musik
resizeCanvas();
</script>

</body>
</html>
